substitutions:
  device_name: reterminal-pv-display
  friendly_name: "PV Display"
  update_interval: 120s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Seeed reTerminal E1001 - solar PV / battery dashboard"
  min_version: 2024.6.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    manual_ip:
      static_ip: 192.168.1.222
      gateway: 192.168.1.1
      subnet: 255.255.255.0
      dns1: 192.168.1.1
      dns2: 1.1.1.1

logger:

# Bare api/ota, no encryption key/password, matching esp32-anj6200-3phases.yaml
api:

ota:
  platform: esphome

# ---------------------------------------------------------------------------
# Home Assistant sensors
# ---------------------------------------------------------------------------
sensor:
  # Live PV production across all 3 Anenji inverters
  - platform: homeassistant
    id: pv_power
    entity_id: sensor.anj_a1a2a3_pv_average_power
    internal: true

  # Whole-house consumption (3-phase clamp meter)
  - platform: homeassistant
    id: house_power
    entity_id: sensor.total_power
    internal: true

  # Net grid power (CT clamp, low-pass filtered): positive = import, negative = export
  - platform: homeassistant
    id: grid_power
    entity_id: sensor.a1a2a3_ct_power_lowpass
    internal: true

  # Battery pack state of charge (Coulomb-count, the trusted SoC source)
  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.batterie_soc_coulomb
    internal: true

  # Battery power flow: positive = charging, negative = discharging
  - platform: homeassistant
    id: battery_power
    entity_id: sensor.anj_a1a2a3_power_fromto_battery
    internal: true

  - platform: homeassistant
    id: battery_voltage
    entity_id: sensor.batterie_tension
    internal: true

  - platform: homeassistant
    id: battery_current
    entity_id: sensor.batterie_courant_total
    internal: true

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 30
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: font_label
    size: 22
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: font_value
    size: 52
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
    glyphsets:
      - GF_Latin_Core

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: ${update_interval}
    lambda: |-
      // ---- Title ----
      it.printf(400, 8, id(font_title), TextAlign::TOP_CENTER, "Installation solaire");
      it.horizontal_line(20, 52, 760);
      it.horizontal_line(20, 53, 760);

      // ---- Row 1: PV / Maison / Reseau ----
      it.vertical_line(280, 70, 190);
      it.vertical_line(540, 70, 190);

      it.printf(150, 85, id(font_label), TextAlign::TOP_CENTER, "Production PV");
      it.printf(150, 150, id(font_value), TextAlign::TOP_CENTER, "%.0f W", id(pv_power).state);

      it.printf(410, 85, id(font_label), TextAlign::TOP_CENTER, "Consommation");
      it.printf(410, 150, id(font_value), TextAlign::TOP_CENTER, "%.0f W", id(house_power).state);

      it.printf(670, 85, id(font_label), TextAlign::TOP_CENTER,
                id(grid_power).state >= 0 ? "Réseau (import)" : "Réseau (export)");
      it.printf(670, 150, id(font_value), TextAlign::TOP_CENTER, "%.0f W", fabs(id(grid_power).state));

      // ---- Row 2: Batterie SoC / Batterie charge-decharge ----
      it.horizontal_line(20, 270, 760);
      it.horizontal_line(20, 271, 760);
      it.vertical_line(400, 285, 175);

      it.printf(205, 300, id(font_label), TextAlign::TOP_CENTER, "Batterie");
      it.printf(205, 345, id(font_value), TextAlign::TOP_CENTER, "%.1f %%", id(battery_soc).state);

      it.printf(595, 300, id(font_label), TextAlign::TOP_CENTER,
                id(battery_power).state >= 0 ? "Charge batterie" : "Décharge batterie");
      it.printf(595, 345, id(font_value), TextAlign::TOP_CENTER, "%.0f W", fabs(id(battery_power).state));

      // ---- Footer: battery voltage / current ----
      it.horizontal_line(20, 445, 760);
      it.printf(400, 452, id(font_small), TextAlign::TOP_CENTER,
                "Batterie: %.1f V | %.1f A", id(battery_voltage).state, id(battery_current).state);
