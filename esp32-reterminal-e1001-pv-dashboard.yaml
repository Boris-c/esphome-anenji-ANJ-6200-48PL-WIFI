substitutions:
  device_name: reterminal-pv-display
  friendly_name: "PV Display"
  update_interval: 120s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Seeed reTerminal E1001 - solar PV / battery dashboard"
  min_version: 2024.6.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    manual_ip:
      static_ip: 192.168.1.222
      gateway: 192.168.1.1
      subnet: 255.255.255.0
      dns1: 192.168.1.1
      dns2: 1.1.1.1
  on_connect:
    - component.update: weather_image

logger:

# Bare api/ota, no encryption key/password, matching esp32-anj6200-3phases.yaml
api:

ota:
  platform: esphome

# ---------------------------------------------------------------------------
# Page navigation (GPIO4 = right white button = next, GPIO5 = left white button = prev)
# ---------------------------------------------------------------------------
globals:
  - id: page_index
    type: int
    restore_value: false
    initial_value: '0'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button_next_page
    internal: true
    on_press:
      then:
        - lambda: |-
            id(page_index) = (id(page_index) + 1) % 5;
        - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_prev_page
    internal: true
    on_press:
      then:
        - lambda: |-
            id(page_index) = (id(page_index) + 4) % 5;
        - component.update: epaper_display

# ---------------------------------------------------------------------------
# Home Assistant sensors
# ---------------------------------------------------------------------------
sensor:
  # Live PV production across all 3 Anenji inverters
  - platform: homeassistant
    id: pv_power
    entity_id: sensor.anj_a1a2a3_pv_average_power
    internal: true

  # Whole-house consumption (3-phase clamp meter)
  - platform: homeassistant
    id: house_power
    entity_id: sensor.total_power
    internal: true

  # Net grid power (CT clamp, low-pass filtered): positive = import, negative = export
  - platform: homeassistant
    id: grid_power
    entity_id: sensor.a1a2a3_ct_power_lowpass
    internal: true

  # Battery pack state of charge (Coulomb-count, the trusted SoC source)
  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.batterie_soc_coulomb
    internal: true

  # Battery power flow: positive = charging, negative = discharging
  - platform: homeassistant
    id: battery_power
    entity_id: sensor.anj_a1a2a3_power_fromto_battery
    internal: true

  - platform: homeassistant
    id: battery_voltage
    entity_id: sensor.batterie_tension
    internal: true

  - platform: homeassistant
    id: battery_current
    entity_id: sensor.batterie_courant_total
    internal: true

  # ---- Today's energy totals (for the "Aujourd'hui" page) ----
  - platform: homeassistant
    id: pv_energy_today
    entity_id: sensor.anj_a1a2a3_pv_energy_today
    internal: true

  - platform: homeassistant
    id: battery_to_today
    entity_id: sensor.a1a2a3_energy_to_battery_integral_today
    internal: true

  - platform: homeassistant
    id: battery_from_today
    entity_id: sensor.a1a2a3_energy_from_battery_integral_today
    internal: true

  - platform: homeassistant
    id: grid_l1_today
    entity_id: sensor.anj_a1_edf_l1_energy_today
    internal: true

  - platform: homeassistant
    id: grid_l2_today
    entity_id: sensor.anj_a2_edf_l2_energy_today
    internal: true

  - platform: homeassistant
    id: grid_l3_today
    entity_id: sensor.anj_a3_edf_l3_energy_today
    internal: true

  # Current electricity price (already accounts for HC/HP time-of-day tariff)
  - platform: homeassistant
    id: price_per_kwh
    entity_id: sensor.electricity_price_per_kwh
    internal: true

  # Today's grid-import cost, correctly HC/HP-split server-side in HA:
  # utility_meter (select.import_reseau + sensor.import_reseau_hc/_hp, sourced
  # from template sensor.import_reseau_total) kept in sync with
  # binary_sensor.batterie_heures_creuses_edf by automation
  # "Tarif import reseau HC/HP", then priced by template sensor
  # sensor.cout_import_reseau_aujourdhui. Durable across reboots/OTA.
  - platform: homeassistant
    id: grid_cost_today
    entity_id: sensor.cout_import_reseau_aujourdhui
    internal: true

# ---------------------------------------------------------------------------
# Weather tab: search.ch meteogram for Prevessin-Moens, rendered to a 1-bit
# PNG server-side (SVG -> rsvg-convert -> ImageMagick threshold) by a local
# script on this Mac (render_weather.sh, scheduled every 30 min via a
# LaunchAgent) and served by a tiny local HTTP server (also a LaunchAgent).
# ESPHome's online_image can't decode SVG directly, only BMP/JPEG/PNG/QOI.
# ---------------------------------------------------------------------------
http_request:
  verify_ssl: false

image:
  - platform: online_image
    id: weather_image
    url: "http://192.168.1.246:8077/weather.png"
    format: PNG
    type: BINARY
    resize: 762x254
    update_interval: 30min
    on_download_finished:
      - component.update: epaper_display

# ---------------------------------------------------------------------------
# On-device trend graphs (3h rolling history, kept in RAM, resets on reboot)
# ---------------------------------------------------------------------------
graph:
  - id: pv_graph
    sensor: pv_power
    duration: 3h
    width: 750
    height: 90
    x_grid: 30min

  - id: battery_graph
    sensor: battery_power
    duration: 3h
    width: 750
    height: 90
    x_grid: 30min

  - id: grid_graph
    sensor: grid_power
    duration: 3h
    width: 750
    height: 90
    x_grid: 30min

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 30
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: font_label
    size: 26
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Inter@700"
    id: font_value
    size: 52
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "↑↓€"
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "↑↓€"

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: ${update_interval}
    lambda: |-
      // ---- Title + page indicator (shown on every page) ----
      it.printf(400, 8, id(font_title), TextAlign::TOP_CENTER, "Installation solaire");
      it.printf(780, 14, id(font_small), TextAlign::TOP_RIGHT, "%d/5", id(page_index) + 1);
      it.horizontal_line(20, 52, 760);
      it.horizontal_line(20, 53, 760);

      if (id(page_index) == 0) {
        // ==== PAGE 1/5: Live dashboard ====
        // ---- Row 1: PV / Maison / Reseau ----
        it.vertical_line(280, 70, 190);
        it.vertical_line(540, 70, 190);

        it.printf(150, 85, id(font_label), TextAlign::TOP_CENTER, "Production PV");
        it.printf(150, 150, id(font_value), TextAlign::TOP_CENTER, "%.0f W", id(pv_power).state);

        it.printf(410, 85, id(font_label), TextAlign::TOP_CENTER, "Consommation");
        it.printf(410, 150, id(font_value), TextAlign::TOP_CENTER, "%.0f W", id(house_power).state);

        it.printf(670, 85, id(font_label), TextAlign::TOP_CENTER,
                  id(grid_power).state >= 0 ? "Réseau (import)" : "Réseau (export)");
        it.printf(670, 150, id(font_value), TextAlign::TOP_CENTER, "%s %.0f W",
                  id(grid_power).state >= 0 ? "↓" : "↑", fabs(id(grid_power).state));

        // ---- Row 2: Batterie SoC / Batterie charge-decharge ----
        it.horizontal_line(20, 270, 760);
        it.horizontal_line(20, 271, 760);
        it.vertical_line(400, 285, 160);

        it.printf(205, 300, id(font_label), TextAlign::TOP_CENTER, "Batterie");
        it.printf(205, 345, id(font_value), TextAlign::TOP_CENTER, "%.1f %%", id(battery_soc).state);

        it.printf(595, 300, id(font_label), TextAlign::TOP_CENTER,
                  id(battery_power).state >= 0 ? "Charge batterie" : "Décharge batterie");
        it.printf(595, 345, id(font_value), TextAlign::TOP_CENTER, "%s %.0f W",
                  id(battery_power).state >= 0 ? "↑" : "↓", fabs(id(battery_power).state));

        // ---- Footer: battery voltage / current ----
        it.horizontal_line(20, 445, 760);
        it.printf(400, 452, id(font_small), TextAlign::TOP_CENTER,
                  "Batterie: %.1f V | %.1f A", id(battery_voltage).state, id(battery_current).state);

      } else if (id(page_index) == 1) {
        // ==== PAGE 2/5: Tendances (3 dernieres heures) ====
        it.printf(30, 62, id(font_label), TextAlign::TOP_LEFT, "Production PV");
        it.printf(770, 62, id(font_small), TextAlign::TOP_RIGHT, "%.0f W", id(pv_power).state);
        it.graph(25, 90, id(pv_graph));

        it.printf(30, 185, id(font_label), TextAlign::TOP_LEFT, "Batterie (+ charge / - décharge)");
        it.printf(770, 185, id(font_small), TextAlign::TOP_RIGHT, "%s %.0f W",
                  id(battery_power).state >= 0 ? "↑" : "↓", fabs(id(battery_power).state));
        it.graph(25, 213, id(battery_graph));

        it.printf(30, 308, id(font_label), TextAlign::TOP_LEFT, "Réseau (+ import / - export)");
        it.printf(770, 308, id(font_small), TextAlign::TOP_RIGHT, "%s %.0f W",
                  id(grid_power).state >= 0 ? "↓" : "↑", fabs(id(grid_power).state));
        it.graph(25, 336, id(grid_graph));

      } else if (id(page_index) == 2) {
        // ==== PAGE 3/5: Aujourd'hui ====
        it.vertical_line(280, 70, 290);
        it.vertical_line(540, 70, 290);

        it.printf(150, 90, id(font_label), TextAlign::TOP_CENTER, "Production PV");
        it.printf(150, 200, id(font_value), TextAlign::TOP_CENTER, "%.1f", id(pv_energy_today).state);
        it.printf(150, 270, id(font_small), TextAlign::TOP_CENTER, "kWh aujourd'hui");

        it.printf(410, 90, id(font_label), TextAlign::TOP_CENTER, "Vers batterie");
        it.printf(410, 200, id(font_value), TextAlign::TOP_CENTER, "%.1f", id(battery_to_today).state);
        it.printf(410, 270, id(font_small), TextAlign::TOP_CENTER, "kWh aujourd'hui");

        it.printf(670, 90, id(font_label), TextAlign::TOP_CENTER, "Depuis batterie");
        it.printf(670, 200, id(font_value), TextAlign::TOP_CENTER, "%.1f", id(battery_from_today).state);
        it.printf(670, 270, id(font_small), TextAlign::TOP_CENTER, "kWh aujourd'hui");

        it.horizontal_line(20, 360, 760);
        float grid_today = id(grid_l1_today).state + id(grid_l2_today).state + id(grid_l3_today).state;
        it.printf(400, 375, id(font_label), TextAlign::TOP_CENTER, "Réseau (import) aujourd'hui");
        it.printf(400, 400, id(font_value), TextAlign::TOP_CENTER, "%.1f kWh", grid_today);

      } else if (id(page_index) == 3) {
        // ==== PAGE 4/5: Euros & autonomie ====
        float grid_import_kwh = id(grid_l1_today).state + id(grid_l2_today).state + id(grid_l3_today).state;
        float grid_cost = id(grid_cost_today).state;
        float self_supplied_kwh = (id(pv_energy_today).state - id(battery_to_today).state) + id(battery_from_today).state;
        float autonomie_den = self_supplied_kwh + grid_import_kwh;
        float autonomie_pct = autonomie_den > 0 ? (self_supplied_kwh / autonomie_den) * 100.0 : 0.0;

        it.vertical_line(280, 70, 290);
        it.vertical_line(540, 70, 290);

        it.printf(150, 90, id(font_label), TextAlign::TOP_CENTER, "Coût réseau");
        it.printf(150, 200, id(font_value), TextAlign::TOP_CENTER, "%.2f", grid_cost);
        it.printf(150, 270, id(font_small), TextAlign::TOP_CENTER, "€ aujourd'hui (HC/HP)");

        it.printf(410, 85, id(font_label), TextAlign::TOP_CENTER, "Économie");
        it.printf(410, 117, id(font_label), TextAlign::TOP_CENTER, "autoconso.");
        it.printf(410, 200, id(font_value), TextAlign::TOP_CENTER, "%.2f", self_supplied_kwh * id(price_per_kwh).state);
        it.printf(410, 270, id(font_small), TextAlign::TOP_CENTER, "€ aujourd'hui");

        it.printf(670, 90, id(font_label), TextAlign::TOP_CENTER, "Autonomie");
        it.printf(670, 200, id(font_value), TextAlign::TOP_CENTER, "%.0f %%", autonomie_pct);
        it.printf(670, 270, id(font_small), TextAlign::TOP_CENTER, "de la conso. aujourd'hui");

      } else {
        // ==== PAGE 5/5: Meteo (search.ch, Prevessin-Moens) ====
        it.image(400, 220, id(weather_image), ImageAlign::CENTER);
      }
