substitutions:
  name0: a1
  name1: a2
  name2: a3
  device_description: "Monitor and control an Anenji hybrid inverter via RS232"
  uart0_tx_pin: GPIO17
  uart0_rx_pin: GPIO16
  uart1_tx_pin: GPIO1
  uart1_rx_pin: GPIO3
  uart2_tx_pin: GPIO25
  uart2_rx_pin: GPIO26

globals:
   - id: slave_output_source_priority_start_time
     type: uint
     restore_value: false
     initial_value: '0'

esphome:
  name: anj
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "syssi.esphome-smg-ii"
    version: 1.2.0

esp32:
  # board: wemos_d1_mini32
  # board: esp32dev
  board: nodemcu-32s
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

wifi:
  networks:
  # - ssid: !secret wifi_ssid
  #   priority: 2
  #   password: !secret wifi_password
  #   manual_ip:
  #     static_ip: 192.168.1.221
  #     gateway: 192.168.1.1
  #     subnet: 255.255.255.0
  - bssid: '00:F7:6F:D2:30:F8' # APE Atelier
    priority: 1
    password: !secret wifi_password
    manual_ip:
      static_ip: 192.168.1.221
      gateway: 192.168.1.1
      subnet: 255.255.255.0
      dns1: 192.168.1.1
      dns2: 1.1.1.1
  - ssid: !secret wifi_ssid
    priority: 0
    password: !secret wifi_password
    manual_ip:
      static_ip: 192.168.1.221
      gateway: 192.168.1.1
      subnet: 255.255.255.0
      dns1: 192.168.1.1
      dns2: 1.1.1.1

ota:
  platform: esphome

logger:
  level: INFO  # 👈 must be at least as detailed as any per-module setting
  baud_rate: 0  # disable UART logging
  logs:
    preferences: INFO
    component: INFO
    modbus: INFO
    modbus_controller: INFO
    api.connection: WARN  # to suppress TCP spam
    modbus_controller.text_sensor: WARN
    modbus_controller.sensor: WARN
    modbus_controller.binary_sensor: WARN
    modbus_controller.select: WARN

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
# mqtt:
#   broker: !secret mqtt_host
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   id: mqtt_client

api:

uart:
  - id: uart_0
    <<: &uart_common
      baud_rate: 9600
      stop_bits: 1
      parity: NONE
      rx_buffer_size: 256
    tx_pin: ${uart0_tx_pin}
    rx_pin: ${uart0_rx_pin}

  - id: uart_1
    <<: *uart_common
    tx_pin: ${uart1_tx_pin}
    rx_pin: ${uart1_rx_pin}

  - id: uart_2
    <<: *uart_common
    tx_pin: ${uart2_tx_pin}
    rx_pin: ${uart2_rx_pin}
    #debug:
    #  direction: BOTH
    #  dummy_receiver: false

modbus:
  - id: modbus0
    <<: &modbus_common
      send_wait_time: 200ms
      turnaround_time: 50ms
    uart_id: uart_0

  - id: modbus1
    <<: *modbus_common
    uart_id: uart_1

  - id: modbus2
    <<: *modbus_common
    uart_id: uart_2

modbus_controller:
  - id: smg0
    <<: &modbus_controller_common
      address: 0x01
      update_interval: 15s
    modbus_id: modbus0

  - id: smg1
    <<: *modbus_controller_common
    modbus_id: modbus1

  - id: smg2
    <<: *modbus_controller_common
    modbus_id: modbus2

time:
  - platform: homeassistant
    id: homeassistant_time

  - platform: sntp
    timezone: Europe/Paris
    id: sntp_time
    on_time:
      # Every 6 hours, restart ESP (might not be necessary)
      - seconds: 0
        minutes: 0
        hours: 1
        then:
          - switch.toggle: restart_espjk

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "ANJ ESP32 WiFi Signal dB"
    id: wifi_signal_db
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "ANJ ESP32 WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  - <<: &PV_energy_today
      platform: total_daily_energy
      restore: true
      icon: mdi:counter
      filters:
        # Multiplication factor from W to kW is 0.001
        - multiply: 0.001
      unit_of_measurement: kWh
      accuracy_decimals: 3
      state_class: total_increasing
      device_class: energy
    name: "${name0} PV energy today"
    power_id: smg0_pv_average_power

  - <<: *PV_energy_today
    name: "${name1} PV energy today"
    power_id: smg1_pv_average_power

  - <<: *PV_energy_today
    name: "${name2} PV energy today"
    power_id: smg2_pv_average_power


  - <<: &EDF_energy_today
      platform: total_daily_energy
      restore: true
      icon: mdi:counter
      filters:
        # Multiplication factor from W to kW is 0.001
        - multiply: 0.001
      unit_of_measurement: kWh
      accuracy_decimals: 3
      state_class: total_increasing
      device_class: energy
    name: "${name0} EDF L1 energy today"
    power_id: smg0_CT_power

  - <<: *EDF_energy_today
    name: "${name1} EDF L2 energy today"
    power_id: smg1_CT_power

  - <<: *EDF_energy_today
    name: "${name2} EDF L3 energy today"
    power_id: smg2_CT_power


  - <<: &battery_energy_today
      platform: total_daily_energy
      restore: true
      icon: mdi:counter
      filters:
        # Multiplication factor from W to kW is 0.001
        - multiply: 0.001
      unit_of_measurement: kWh
      accuracy_decimals: 3
      state_class: total_increasing
      device_class: energy
    name: "${name0} battery energy today"
    power_id: smg0_battery_power

  - <<: *battery_energy_today
    name: "${name1} battery energy today"
    power_id: smg1_battery_power

  - <<: *battery_energy_today
    name: "${name2} battery energy today"
    power_id: smg2_battery_power

  # Fault code                                                    ULong 100 2 R
  - <<: &fault_code
      platform: modbus_controller
      address: 100
      register_type: holding
      value_type: U_DWORD
      accuracy_decimals: 0
    modbus_controller_id: smg0
    name: "${name0} fault code"

  - <<: *fault_code
    modbus_controller_id: smg1
    name: "${name1} fault code"

