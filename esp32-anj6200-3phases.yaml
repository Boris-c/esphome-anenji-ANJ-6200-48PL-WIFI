    modbus_controller_id: smg1
    name: "${name1} warning"

  - <<: *warning
    modbus_controller_id: smg2
    name: "${name2} warning"


  # Operation Mode                                                UInt  201 1 R 0: Power On, 1: Standby, 2: Mains, 3: Off-Grid, 4: Bypass, 5: Charging, 6: Fault
  - <<: &operation_mode
      platform: modbus_controller
      address: 201
      register_type: holding
      raw_encode: HEXBYTES
      lambda: |-
        uint16_t value = modbus_controller::word_from_hex_str(x, 0);
        switch (value) {
          case 0: return std::string("Power On");
          case 1: return std::string("Standby");
          case 2: return std::string("Mains");
          case 3: return std::string("Off-Grid");
          case 4: return std::string("Bypass");
          case 5: return std::string("Charging");
          case 6: return std::string("Fault");
        }
        return std::string("Unknown");
    modbus_controller_id: smg0
    name: "${name0} operation mode"

  - <<: *operation_mode
    modbus_controller_id: smg1
    name: "${name1} operation mode"

  - <<: *operation_mode
    modbus_controller_id: smg2
    name: "${name2} operation mode"


  - platform: template
    name: "ESP SNTP Time"
    update_interval: 60s
    lambda: |-
      char str[25];
      time_t curr_time = id(sntp_time).now().timestamp;
      strftime(str, sizeof(str), "%Y-%m-%d %H:%M:%S", localtime(&curr_time));
      return std::string(str);
      
