  # Power flow status                                     --       UInt  231 1 R
  # GM6200 / Anenji 6.2 kW variant of the SMG II power-flow flags.
  # bit0~1 0: PV disconnected; 1: PV connected
  # bit2~3 0: Mains disconnected; 1: Mains connected; 2: Inverter connected to grid
  # bit4~5 0: Battery idle; 1: Battery charging; 2: Battery discharging
  # bit6~7 0: Load not supplied; 1: Load supplied
  # bit8   0: Not charged by AC; 1: Charged by AC
  # bit9   0: PV not charging; 1: PV charging
  # bit10  0: Battery icon on; 1: Battery icon off
  # bit11  0: PV icon on; 1: PV icon off
  # bit12  0: Mains icon on; 1: Mains icon off
  # bit13  0: Load icon on; 1: Load icon off
  - <<: &power_flow_status_code
      platform: modbus_controller
      address: 231
      register_type: holding
      value_type: U_WORD
      accuracy_decimals: 0
    id: smg0_power_flow_status
    modbus_controller_id: smg0
    name: "${name0} power flow status code"

  - <<: *power_flow_status_code
    id: smg1_power_flow_status
    modbus_controller_id: smg1
    name: "${name1} power flow status code"

  - <<: *power_flow_status_code
    id: smg2_power_flow_status
    modbus_controller_id: smg2
    name: "${name2} power flow status code"

  # External CT sampling power                            1W       Int   235 2 R
