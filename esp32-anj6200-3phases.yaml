  #   name: "${name0} 185"

  - platform: modbus_controller
    id: "${name0}200_"
    address: 200
    register_type: holding
    value_type: U_WORD
    modbus_controller_id: smg0
    name: "${name0} 200 Invalid data Internal command"

  # DC bus voltage                                       0.1V     Uint  218 1 R
  - <<: &dc_bus_voltage
      platform: modbus_controller
      address: 218
      register_type: holding
      value_type: U_WORD
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      accuracy_decimals: 1
      filters:
        - multiply: 0.1
    modbus_controller_id: smg0
    name: "${name0} DC bus voltage"

  - <<: *dc_bus_voltage
    modbus_controller_id: smg1
    name: "${name1} DC bus voltage"

  - <<: *dc_bus_voltage
    modbus_controller_id: smg2
    name: "${name2} DC bus voltage"
    
