  # Operation Mode                                                UInt  201 1 R 0: Power On
  #                                                                             1: Standby
  #                                                                             2: Mains
  #                                                                             3: Off-Grid
  #                                                                             4: Bypass
  #                                                                             5: Charging
  #                                                                             6: Fault

  - platform: modbus_controller
    address: 184
    id: "${name0}184Invaliddata2"
    register_type: holding
    value_type: U_WORD
    modbus_controller_id: smg0
    name: "${name0} 184 Invalid data"
  # - platform: modbus_controller
